# L01 공통 파이프라인 config (모든 binder 공용). __LIG__ 자리만 binder ID로 치환해 사용.
# run_pipeline.py 는 complex 1개당 1회 실행 → 러너가 binder마다 이 파일의 __LIG__를 바꿔 돌림.
# 0단계(collect)는 우리가 만든 합본 master_table로 대체 → 항상 --from cache 로 실행.
target       = L01

# --from cache 라 collect 안 함 → results_dir 는 읽지 않음(형식상 필수라 유효 경로만).
results_dir  = /path/to/casp17-ligand/users/USERNAME/targets/L01/consensus/__LIG__/results

# out_dir/00_collect/master_table.csv = 우리 합본 테이블(bt2+pt2). 1단계부터 이걸 입력으로.
out_dir      = /path/to/casp17-ligand/users/USERNAME/targets/L01/consensus/__LIG__

# 리간드 SMILES (binder별로 이미 존재)
ligand_tsv   = /path/to/casp17-ligand/users/USERNAME/targets/L01/outputs/__LIG__/ligand.tsv

task         = P

python_stdlib = /path/to/casp17-ligand/.micromamba/envs/boltz2/bin/python
python_sci    = /path/to/casp17-ligand/.micromamba/envs/boltz2/bin/python
python_pb     = /path/to/casp17-ligand/.micromamba/envs/casp_eval/bin/python
refine        = true
author        = CHANGE-ME

# ============================================================
# [은퇴 / RETIRED] 2026-07-16
# 이 템플릿은 Vina 도킹 방식 Stage1(apo fold → p2rank 박스 → gnina 도킹 → bind.txt)용.
# 드라이버(run_stage1.py, s1_prep_receptor.py, s2_dock_library.py,
#   s3_binding_pocket.py, s4_make_bind_txt.py, make_active_box.py)는
#   재구성 때 legacy로 이동됨:
#   pipeline/legacy_pipeline/legacy/legacy_0715/
# 현행 주력 Stage1 = boltz cofold 방식(stage1/run_stage1_frag.sh, config 안 읽음).
# 이 방식을 다시 쓰려면 scripts_dir 를 위 legacy 경로로 바꿔야 함.
# ============================================================
#
# Stage1(도킹) 설정 템플릿. 복사해서 L01.conf / L02.conf 로.
# 필수: target, group, results_dir, apo_dir, ligand_tsv, out_dir, scripts_dir

target        = L01
group         = CHANGE-ME          # 우리 모델 그룹 코드(예: 987)

# AF3 결과 폴더(seed_*/sample_* 있는 곳) — s0가 여기서 다양한 apo N개 선택
results_dir   = /path/to/casp17-ligand/.../users/USERNAME/targets/L01/results/A1/af3_msa/af3
# 앙상블 apo cif 출력 폴더(s0 → ens_*.cif)
apo_dir       = /path/to/casp17-ligand/.../users/USERNAME/targets/L01/apo

# 앙상블·다중포켓
ensemble_n    = 3                  # 도킹에 쓸 다양한 구조 수(farthest-point 선택)
pockets_m     = 2                  # 구조당 p2rank 포켓 수 → 박스 = ensemble_n × pockets_m

# CASP_ID<TAB>Canonical_smiles 표 (L01=1209, L02=647 fragment)
ligand_tsv    = /path/to/casp17-ligand/.../users/USERNAME/targets/L01/inputs/L01_ligands.tsv

out_dir       = /path/to/casp17-ligand/.../users/USERNAME/targets/L01/stage1_out
scripts_dir   = /path/to/casp17-ligand/users/USERNAME/pipeline/stage1

python        = /path/to/casp17-ligand/.micromamba/envs/boltz2/bin/python

# 도킹 박스 / gnina
box_size      = 22.0
exhaustiveness = 8
num_modes     = 5
jobs          = 4                  # 동시 도킹 수(공용서버 배려)
gpus          = 0,1,2,3            # 라운드로빈 GPU id (빈값=CPU/미지정)

# 결합확률 = w_cnn·rank(CNNscore) + w_cnnaff·rank(CNNaffinity)  (랭킹만 중요)
w_cnn         = 0.5
w_cnnaff      = 0.5
bind_threshold = 0.0               # 이 값 미만은 non-binder(0). 0이면 확률 그대로

# pocket 잔기 거리 (대회 정의 = 5Å)
pocket_cutoff = 5.0

# 테스트: 상위 N개만 도킹 (0=전체)
max           = 0

# ── L02 전용 추가 ──

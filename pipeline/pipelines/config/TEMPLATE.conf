# ============================================================
#  계층형 CASP 리간드 파이프라인 설정 (타겟마다 복사·수정)
#  사용:  cp config/TEMPLATE.conf config/<TARGET>.conf   → [필수] 아래 4줄 + task 수정
#  형식:  key = value   (# 뒤는 주석). 안 쓰는 키는 지워도 됨(기본값 자동).
# ============================================================
target = T2500

# === [필수] 경로 3개 + task ==================================
# 팀 cofolding 결과 (READ-ONLY). <model>/seed_*/sample_*/summary.json 가 있는 폴더.
#   ⚠️ targets_ligand vs targets 는 타겟마다 다름 (예: T2383=targets_ligand, T2412=targets).
results_dir = /path/to/casp17-data/targets_ligand/T2500/results/A1+LIG/af3_msa
# 출력 폴더 (users/<나> 내부; 00_collect ~ 08_casp_lg 하위폴더 자동 생성). 없으면 만들어짐.
out_dir     = /path/to/casp17-ligand/users/USERNAME/targets/T2500/outputs
# 리간드 TSV (Name<TAB>Task<TAB>Canonical_SMILES). CASP 입력에서 준비.
ligand_tsv  = /path/to/casp17-ligand/users/USERNAME/targets/T2500/ligand.tsv
# (scripts_dir 불필요 — run_pipeline.py 가 자기 위치로 core/boost/analysis 자동 해석)

# Task: P = pose 중심 / PA = pose + affinity(가중치↑)
task = P

# === 환경 실행 커맨드 ========================================
# sbatch 비대화 셸엔 micromamba 가 PATH에 없을 수 있음 → env python 절대경로 직접 지정이 견고.
#   확인: ls /path/to/casp17-ligand/.micromamba/envs/boltz2/bin/python
python_stdlib = /path/to/casp17-ligand/.micromamba/envs/boltz2/bin/python
python_sci    = /path/to/casp17-ligand/.micromamba/envs/boltz2/bin/python
# PoseBusters 물리검증 env (설치된 env). 비우면 해당 스텝 스킵.
python_pb     = /path/to/casp17-ligand/.micromamba/envs/casp_eval/bin/python

# === 단계별 임계값 (기본값 권장) =============================
protein_chain    =            # 비우면 전체 체인쌍 평균(범용)
conf_gap_frac    = 0.20       # Step0 형태 분리 민감도(PC1 범위 대비 틈)
pocket_threshold = 8.0        # Step1 포켓(센트로이드) 클러스터 거리 Å  ★cutoff
topn_pockets     = 10         # Step1 포켓 후보 수
gnina_cutoff     = -4.0       # Step2 통과: gnina(=Vina) affinity <= 값
p2rank_dist      = 6.0        # Step2 통과: 최근접 p2rank 포켓 거리 <= 값 Å
ligand_threshold = 2.0        # Step3 포켓별 리간드 SC-RMSD 클러스터 Å
top_final        = 5          # Step4 최종 제출 수
author           = USERNAME  # CASP LG author (미지정 시 env CASP_AUTHOR)

# === 회의 반영(2026-07) 신규 키 =============================
pocket_members_topk = 5       # Step2 포켓별 멤버 채점 수 → mean/std affinity·cnn. 0=대표만(비용↓)
pocket_sweep        =         # 예 "6,8,10,12": 포켓 불명확할 때 여러 cutoff 진단표만 출력(참고용)
template_pass_dist  = 8.0     # template_dist <= 값이면 그 포켓 pass 자동 승격(리간드 있는 템플릿 근처)

# === [선택] 템플릿 (리간드 포함 RCSB 원본 cif) ===============
#   둘 중 하나:  templates = 콤마목록   또는   templates_dir = 폴더(그 안 *.cif 전부)
#   주면 Step2(template_dist·pass 승격) + 10(후보 대조) + 8(접촉지문 격자) 자동 실행.
#   ⚠️ inputs 의 리간드 제거본(template_A_*.cif)이 아니라 리간드 포함 원본이어야 함.
templates      =
templates_dir  = /path/to/casp17-ligand/users/USERNAME/templates/T2500

# === [선택] 실험 구조 (대회 후 정답/유사구조) ===============
experimental_cif =

# === [선택] 포즈 정제 (gnina --minimize) ====================
refine           = true
refine_iters     = 25
refine_max_drift = 2.0        # 정제 drift > 값 Å 이면 원본 유지(안전장치)

# === [선택] 성능 / 강건성 ====================================
gnina_jobs        = 1         # gnina 병렬 워커(공용서버 배려 기본 1=순차)
gnina_gpus        =           # 예 "0,1,2" 라운드로빈 GPU id (빈값=미지정)
posebusters_topk  = 3         # 클러스터당 PoseBusters 검사 상위 멤버 수(medoid 강건화)
exclude_models    =           # 예 "of3_collapse" 오염 모델 폴더 제외
pocket_auto_relax =           # true면 통과 0개일 때 임계 자동 완화(기본 off = 사람이 판단)
split_by_conformation =       # true면 형태(conf)별 분리 포켓 클러스터링
